<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login | AgriVision AI</title>

<link rel="stylesheet" href="../css/login.css">

</head>

<body>

<header>

    <nav>

        <div class="logo">
            🍃 AgriVision <span>AI</span>
        </div>

        <div class="nav-links">

            <a href="landing.html" class="nav-button">
                Home
            </a>

        </div>

    </nav>

</header>


<main>

    <section class="login-section">

        <div class="login-container">


            <div class="login-info">

                <div class="ai-icon">
                    🌿
                </div>

                <h1>
                    Welcome to
                    <span>AgriVision AI</span>
                </h1>

                <p>
                    Sign in to access your intelligent
                    plant disease detection dashboard.
                </p>

            </div>


            <div class="login-box">

                <div class="login-header">

                    <h2>
                        Sign In
                    </h2>

                    <p>
                        Access your account
                    </p>

                </div>


                <form id="loginForm">


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="form-options">

                        <label>

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            Remember me

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >

                        🔐 Sign In

                    </button>


                    <p
                        id="loginMessage"
                        class="login-message"
                    ></p>


                </form>


                <div class="divider">

                    <span>
                        OR
                    </span>

                </div>


                <button
                    class="google-button"
                    id="googleLogin"
                >

                    🔵 Continue with Google

                </button>


            </div>

        </div>

    </section>

</main>


<footer>

    <p>
        © 2026
        <span>AgriVision AI</span>
        | Plant Disease Detection Using DNN
    </p>

</footer>

<script src="https://accounts.google.com/gsi/client" defer></script>
<script src="../js/config.js" defer></script>
<script src="../js/login.js" defer></script>

</body>

</html>
